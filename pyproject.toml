[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-12lead-self-supervised-engine"
version = "2.0.0"
description = "ECG-Foundation: 12-Lead Contrastive Masked Waveform Model Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
ecg-12lead-self-supervised-engine = "ecg_foundation.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ecg-12lead-self-supervised-agent"
Repository = "https://github.com/abusuraihsakhri/ecg-12lead-self-supervised-agent"

[tool.setuptools]
packages = ["agents", "ecg_foundation"]
py-modules = ["ecg_interpretation", "enrichment", "simulator", "cli", "ecg_foundation_app"]
