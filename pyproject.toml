[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-12lead-self-supervised-engine"
version = "2.0.0"
description = "ECG-Foundation: 12-Lead Contrastive Masked Waveform Model Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ecg-12lead-self-supervised-engine = "ecg_foundation.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ecg-12lead-self-supervised-engine"
Repository = "https://github.com/abusuraihsakhri/ecg-12lead-self-supervised-engine.git"
