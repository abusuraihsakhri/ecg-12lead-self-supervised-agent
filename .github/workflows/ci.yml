name: Ecg 12Lead Self Supervised Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest httpx2

    - name: Compile Python sources
      run: python -m compileall -q agents ecg_foundation cli.py ecg_interpretation.py enrichment.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Validate browser JavaScript syntax
      run: |
        python - <<'PY'
        from html.parser import HTMLParser
        from pathlib import Path

        class Scripts(HTMLParser):
            def __init__(self):
                super().__init__()
                self.capture = False
                self.parts = []
            def handle_starttag(self, tag, attrs):
                if tag == "script" and not dict(attrs).get("src"):
                    self.capture = True
            def handle_endtag(self, tag):
                if tag == "script":
                    self.capture = False
            def handle_data(self, data):
                if self.capture:
                    self.parts.append(data)

        parser = Scripts()
        parser.feed(Path("web/index.html").read_text(encoding="utf-8"))
        assert parser.parts, "Missing inline calculator logic"
        Path("/tmp/ecg-web-script.js").write_text("\\n".join(parser.parts), encoding="utf-8")
        PY
        node --check /tmp/ecg-web-script.js

    - name: Docker and HTTP smoke test
      if: matrix.python-version == '3.12'
      run: |
        docker build -t ecg-reference-ci .
        docker run -d --name ecg-reference-ci -p 18000:8000 \
          -e AUDIT_SECRET_KEY=CI-TEST-ONLY-DONT-USE-IN-PRODUCTION ecg-reference-ci
        trap 'docker rm -f ecg-reference-ci || true' EXIT
        for n in $(seq 1 30); do
          if curl -fsS http://localhost:18000/health > /tmp/ecg-health.json; then break; fi
          sleep 1
        done
        python -c 'import json; assert json.load(open("/tmp/ecg-health.json"))["status"] == "HEALTHY"'
        curl -fsS http://localhost:18000/ | grep -q '12-Lead ECG Reference Tools'
        curl -fsS -H 'Content-Type: application/json' \
          -d '{"task_id":"SMOKE-1","target_identifier":"DEMO-1","primary_metric":12,"secondary_metric":2}' \
          http://localhost:18000/api/audit | grep -q '"ROUTINE"'

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
